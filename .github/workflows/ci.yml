name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm-macos:
    name: swift build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  xcodebuild-ios:
    name: xcodebuild test (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9A-Za-z ]+' | head -1 | sed 's/ *$//')
          echo "Using simulator: ${NAME:-iPhone 16}"
          echo "name=${NAME:-iPhone 16}" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -scheme Linklab \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcpretty --color || exit ${PIPESTATUS[0]}

  pod-lint:
    name: pod lib lint
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lint podspec
        run: pod lib lint Linklab.podspec --allow-warnings --skip-tests
